<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1040" viewBox="0 0 1480 1040" role="img" aria-labelledby="title desc">
<title id="title">KSEO Architecture</title>
<desc id="desc">任务合同驱动可恢复 Runner，经 Optimizer、源码隔离、Executor 和外部 adapter 生成原始数据，由独立 Validator 验收并完成反馈、最终复验和交付。</desc>
