<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">KSEO Architecture</title><desc id="desc">分层架构只表达职责与依赖；执行顺序和反馈在独立流程图中展示</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2475dd"/></marker></defs>
<rect width="1440" height="1120" rx="20" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="44" y="55" font-size="30" fill="#10294a" font-weight="700">KSEO Architecture</text>
<text x="44" y="90" font-size="17" fill="#56708b">分层架构只表达职责与依赖；执行顺序和反馈在独立流程图中展示</text>
<rect x="44" y="130" width="1352" height="150" rx="12" fill="#edf3fb" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="64" y="175" font-size="21" fill="#10294a" font-weight="700">L1 目标与上下文</text>
<text x="64" y="207" font-size="16" fill="#56708b">输入、能力与评测目标</text>
<rect x="44" y="330" width="1352" height="150" rx="12" fill="#edf3fb" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="64" y="375" font-size="21" fill="#10294a" font-weight="700">L2 System 编排层</text>
<text x="64" y="407" font-size="16" fill="#56708b">端到端大流程与决策</text>
<rect x="44" y="530" width="1352" height="280" rx="12" fill="#edf3fb" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="64" y="575" font-size="21" fill="#10294a" font-weight="700">L3 优化子流程</text>
<text x="64" y="607" font-size="16" fill="#56708b">局部分析、候选与证据</text>
<rect x="44" y="860" width="1352" height="200" rx="12" fill="#edf3fb" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="64" y="905" font-size="21" fill="#10294a" font-weight="700">L4 共享运行基础</text>
<text x="64" y="937" font-size="16" fill="#56708b">执行、状态与可信验证</text>
<path d="M860 283 V326" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M860 483 V526" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M860 813 V856" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="290" y="163" width="330" height="90" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="308" y="197" font-size="20" fill="#10294a" font-weight="700">模型与运行环境</text>
<text x="308" y="227" font-size="16" fill="#56708b">模型、源码、镜像、服务器</text>
<rect x="650" y="163" width="330" height="90" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="668" y="197" font-size="20" fill="#10294a" font-weight="700">Workload 与能力</text>
<text x="668" y="227" font-size="16" fill="#56708b">请求分布、上下文、模型特性</text>
<rect x="1010" y="163" width="330" height="90" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="1028" y="197" font-size="20" fill="#10294a" font-weight="700">优化目标与预算</text>
<text x="1028" y="227" font-size="16" fill="#56708b">TTFT / TPOT / 吞吐 / 质量</text>
<rect x="290" y="363" width="330" height="90" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="308" y="397" font-size="20" fill="#10294a" font-weight="700">System Workflow</text>
<text x="308" y="427" font-size="16" fill="#56708b">基线、迭代、最终复验与交付</text>
<rect x="650" y="363" width="330" height="90" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="668" y="397" font-size="20" fill="#10294a" font-weight="700">Strategy Router</text>
<text x="668" y="427" font-size="16" fill="#56708b">配置优先；按当前热点与收益路由</text>
<rect x="1010" y="363" width="330" height="90" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="1028" y="397" font-size="20" fill="#10294a" font-weight="700">E2E Integrator</text>
<text x="1028" y="427" font-size="16" fill="#56708b">集成、验收、最佳方案与回退</text>
<rect x="290" y="565" width="330" height="195" rx="12" fill="#ffffff" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="308" y="599" font-size="21" fill="#10294a" font-weight="700">Configuration Workflow</text>
<text x="308" y="629" font-size="16" fill="#56708b">flags / env / backend</text>
<text x="308" y="653" font-size="16" fill="#56708b">有限搜索 → 参数候选</text>
<text x="308" y="677" font-size="16" fill="#56708b">返回配置与可检验假设</text>
<rect x="650" y="565" width="330" height="195" rx="12" fill="#ffffff" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="668" y="599" font-size="21" fill="#10294a" font-weight="700">Scheduling Workflow</text>
<text x="668" y="629" font-size="16" fill="#56708b">host / 通信 / 调度</text>
<text x="668" y="653" font-size="16" fill="#56708b">热点分析 → 可回退候选</text>
<text x="668" y="677" font-size="16" fill="#56708b">返回参数或源码 patch</text>
<rect x="1010" y="565" width="330" height="195" rx="12" fill="#ffffff" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="1028" y="599" font-size="21" fill="#10294a" font-weight="700">Kernel Workflow</text>
<text x="1028" y="629" font-size="16" fill="#56708b">真实调用提取 → 冻结 oracle</text>
<text x="1028" y="653" font-size="16" fill="#56708b">局部正确性与性能验证</text>
<text x="1028" y="677" font-size="16" fill="#56708b">返回 patch 与独立证据</text>
<text x="310" y="790" font-size="17" fill="#2475dd">子流程不直接宣布端到端成功；候选统一交回 System 层验收。</text>
<rect x="290" y="887" width="330" height="59" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="308" y="921" font-size="18" fill="#10294a" font-weight="700">Executor / Backend adapters</text>
<rect x="650" y="887" width="330" height="59" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="668" y="921" font-size="18" fill="#10294a" font-weight="700">Source snapshot / Patch</text>
<rect x="1010" y="887" width="330" height="59" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="1028" y="921" font-size="18" fill="#10294a" font-weight="700">Validator / 原始证据</text>
<rect x="290" y="968" width="330" height="59" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="308" y="1002" font-size="18" fill="#10294a" font-weight="700">状态、预算与资源租约</text>
<rect x="650" y="968" width="330" height="59" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="668" y="1002" font-size="18" fill="#10294a" font-weight="700">Profile / 实验账本</text>
<rect x="1010" y="968" width="330" height="59" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="1028" y="1002" font-size="18" fill="#10294a" font-weight="700">Knowledge / 经验记忆</text>
<text x="44" y="1095" font-size="17" fill="#56708b">纵向箭头仅表示层间依赖。外部 Agent 与平台脚本通过子流程协议和 Backend adapters 接入。</text>
</g></svg>