<text x="870" y="228" font-size="13" fill="#56708b">相同测量条件</text>
<path d="M1032 195 H1050" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1054" y="140" width="180" height="110" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="1072" y="174" font-size="17" fill="#10294a" font-weight="700">返回 patch 与证据</text>
<text x="1072" y="204" font-size="13" fill="#56708b">源码 tree</text>
<text x="1072" y="228" font-size="13" fill="#56708b">patch / evidence hash</text>
<rect x="44" y="290" width="1190" height="65" rx="12" fill="#e7f0ff" stroke="#d0e1fa" stroke-width="1.5"/>
<text x="65" y="329" font-size="19" fill="#10294a">子流程在此返回。System 接手：可逆集成 → E2E 验收 → 保留或回退。</text>
