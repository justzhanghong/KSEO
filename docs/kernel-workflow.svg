<text x="62" y="204" font-size="13" fill="#56708b">shape / dtype</text>
<text x="62" y="228" font-size="13" fill="#56708b">实际输入与边界</text>
<path d="M224 195 H242" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="246" y="140" width="180" height="110" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="264" y="174" font-size="17" fill="#10294a" font-weight="700">冻结 oracle</text>
<text x="264" y="204" font-size="13" fill="#56708b">参考实现与 I/O</text>
<text x="264" y="228" font-size="13" fill="#56708b">文件清单与 SHA256</text>
<path d="M426 195 H444" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="448" y="140" width="180" height="110" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="466" y="174" font-size="17" fill="#10294a" font-weight="700">提出 Kernel 候选</text>
<text x="466" y="204" font-size="13" fill="#56708b">独立源码与 patch</text>
<text x="466" y="228" font-size="13" fill="#56708b">限定 editable_files</text>
<path d="M628 195 H646" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="650" y="140" width="180" height="110" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="668" y="174" font-size="17" fill="#10294a" font-weight="700">独立正确性验证</text>
<text x="668" y="204" font-size="13" fill="#56708b">完整 cases 与实际路径</text>
<path d="M830 195 H848" fill="none" stroke="#2475dd" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="852" y="140" width="180" height="110" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
<text x="870" y="174" font-size="17" fill="#10294a" font-weight="700">局部性能验证</text>
