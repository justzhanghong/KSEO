<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">Kernel Workflow</title><desc id="desc">Kernel 层内部小流程：独立 oracle、独立验证与可集成产物</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2475dd"/></marker></defs>
<rect width="1280" height="390" rx="20" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="44" y="55" font-size="30" fill="#10294a" font-weight="700">Kernel Workflow</text>
<text x="44" y="90" font-size="17" fill="#56708b">Kernel 层内部小流程：独立 oracle、独立验证与可集成产物</text>
<rect x="44" y="140" width="180" height="110" rx="12" fill="white" stroke="#d5e1ef" stroke-width="1.5"/>
