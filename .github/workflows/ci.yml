name: KSEO 检查
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: 运行测试并保存输出
        run: python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/kseo-tests.log"
      - name: 输出失败摘要
        if: failure()
        env:
          KSEO_TEST_LOG: ${{ runner.temp }}/kseo-tests.log
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['KSEO_TEST_LOG'])
          if path.is_file():
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-120:])[-30000:]
              message = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Python 测试失败摘要::' + message)
          PY
      - run: kseo demo --run-dir "$RUNNER_TEMP/kseo-grid"
      - run: kseo demo --agent --run-dir "$RUNNER_TEMP/kseo-agent"
      - run: kseo demo --pipeline --run-dir "$RUNNER_TEMP/kseo-pipeline"
